name: Render catalog

# Every PR and push to main type-checks and builds the app. Then only the
# catalog parts whose sources changed (tools/part-keys.mjs follows each part
# through the library) are rendered and size-checked, in every size; nothing
# renders when no part source changed.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - name: Did any part source change?
        id: parts
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then git fetch -q --no-tags origin "${{ github.base_ref }}"; base=$(git merge-base FETCH_HEAD HEAD); else base="${{ github.event.before }}"; fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          if git diff --quiet "$base" HEAD -- scad catalog lib tools/render.mjs tools/render-catalog.mjs tools/render-worker.mjs tools/part-keys.mjs tools/stl-stats.mjs package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "No part source changed since $base: skipping the catalog render."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check and build the web app
        run: npm run build
      - name: Render the changed catalog parts (PETG profile) and check sizes
        if: steps.parts.outputs.changed == 'true'
        run: npm run render -- --profile PETG --out out --changed-since ${{ steps.parts.outputs.base }}
      - uses: actions/upload-artifact@v4
        if: steps.parts.outputs.changed == 'true'
        with:
          name: parts-PETG
          path: out/**/PETG/*.stl
          retention-days: 14
          if-no-files-found: ignore
