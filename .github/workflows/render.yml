name: Render catalog

on:
  push:
    branches: [main]
  pull_request:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check and build the web app
        run: npm run build
      - name: Render every catalog part in both sizes (PETG profile) and check sizes
        run: npm run render -- --profile PETG --out out
      - uses: actions/upload-artifact@v4
        with:
          name: parts-PETG
          path: out/**/PETG/*.stl
          retention-days: 14
