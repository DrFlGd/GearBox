name: Release

# Push a tag like v0.1.0, or run this workflow by hand with a version, and it
# publishes a GitHub release (creating the tag if needed) with one STL zip per
# size and print profile attached. The zips are rendered fresh only when a part
# source changed since the previous release (the OpenSCAD library, the catalog,
# BOSL2, the render tools or the engine version); otherwise the previous
# release's zips are carried over under the new version. `parts` forces either.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to release, e.g. v0.1.0"
        required: true
        type: string
      parts:
        description: "STL zips: auto (render only if a part source changed), render, or reuse the previous release's"
        required: false
        default: auto
        type: choice
        options: [auto, render, reuse]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pick the version
        id: ver
        run: echo "tag=${{ inputs.version || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - name: Render or reuse the STL zips
        id: parts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          MODE: ${{ inputs.parts || 'auto' }}
        run: |
          prev=$(gh api "repos/${{ github.repository }}/releases?per_page=20" --jq '.[] | select(.draft | not) | .tag_name' | grep -vx "$TAG" | head -1 || true)
          mode=$MODE
          if [ "$mode" = auto ]; then
            if [ -n "$prev" ] && git diff --quiet "$prev" HEAD -- scad catalog lib tools/render.mjs tools/render-catalog.mjs tools/stl-stats.mjs package-lock.json; then mode=reuse; else mode=render; fi
          fi
          if [ "$mode" = reuse ]; then
            if [ -n "$prev" ] && gh release download "$prev" -p 'gearbox-*-stl-*.zip' && ls gearbox-*-stl-*.zip >/dev/null 2>&1; then
              for f in gearbox-"$prev"-stl-*.zip; do mv "$f" "${f/$prev/$TAG}"; done
              echo "note=STL zips: no part changed since $prev, so these are the same parts as $prev." >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "No zips to reuse from '$prev', rendering instead."
          fi
          echo "render=true" >> "$GITHUB_OUTPUT"
          echo "note=STL zips: every catalog part rendered fresh for this release." >> "$GITHUB_OUTPUT"
      - name: Render every size and profile
        if: steps.parts.outputs.render == 'true'
        run: |
          for p in PLA PETG ABS; do
            node tools/render-catalog.mjs --profile $p --out out
            for s in M2 M1.5 M1; do
              (cd out/$s && zip -qr ../../gearbox-${{ steps.ver.outputs.tag }}-stl-$s-$p.zip $p)
            done
          done
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.ver.outputs.tag }}
          body: ${{ steps.parts.outputs.note }}
          generate_release_notes: true
          files: gearbox-*.zip
