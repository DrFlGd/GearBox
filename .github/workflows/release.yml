name: Release

# Push a tag like v0.1.0 and this renders every catalog part for each print
# profile, zips them and publishes a GitHub release with the zips attached.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Render every profile
        run: |
          for p in PLA PETG ABS; do
            node tools/render-catalog.mjs --profile $p --out out
            (cd out && zip -qr ../gearbox-${GITHUB_REF_NAME}-stl-$p.zip $p)
          done
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: gearbox-*.zip
