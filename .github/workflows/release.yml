name: Release

# Push a tag like v0.1.0, or run this workflow by hand with a version, and it
# renders every catalog part for both sizes and each print profile, zips them
# (one zip per size and profile) and publishes a GitHub release with the zips
# attached (creating the tag if needed).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to release, e.g. v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pick the version
        id: ver
        run: echo "tag=${{ inputs.version || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - name: Render every size and profile
        run: |
          for p in PLA PETG ABS; do
            node tools/render-catalog.mjs --profile $p --out out
            for s in M2 M1.5; do
              (cd out/$s && zip -qr ../../gearbox-${{ steps.ver.outputs.tag }}-stl-$s-$p.zip $p)
            done
          done
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: gearbox-*.zip
